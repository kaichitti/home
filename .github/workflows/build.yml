name: Build ISO

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build WebBrowse Linux ISO
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Alpine build host
        uses: jirutka/setup-alpine@v1
        with:
          branch: v3.20
          arch: x86_64

      - name: Alpine sanity check
        shell: alpine.sh --root {0}
        run: |
          set -eux
          cat /etc/alpine-release
          apk --version
          apk update

      - name: Build ISO
        id: build
        continue-on-error: true
        shell: alpine.sh --root {0}
        env:
          ALPINE_VERSION: "3.20"
          ARCH: x86_64
          PRODUCT_NAME: WebBrowse Linux
          ISO_NAME: webbrowse-linux.iso
        run: |
          chmod +x scripts/build-iso.sh
          # Tee into the workspace so the outer runner can read the log
          # even when the chroot shell dies.
          scripts/build-iso.sh 2>&1 | tee build.log
          echo "rc=${PIPESTATUS:-$?}" >> "$GITHUB_OUTPUT"

      - name: Publish build log
        if: always()
        run: |
          if [ -f build.log ]; then
            {
              echo '### Build log (last 400 lines)'
              echo ''
              echo '```'
              tail -n 400 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo '_No build.log produced — step failed before the build script ran._' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail if build script failed
        if: steps.build.outcome != 'success'
        run: |
          echo "::error::Build script failed. See Summary for the build log."
          exit 1

      - name: Record ISO metadata
        id: iso
        run: |
          ISO_PATH="output/webbrowse-linux.iso"
          if [ ! -f "$ISO_PATH" ]; then
            echo "::error::ISO not found at $ISO_PATH"
            ls -la output || true
            exit 1
          fi
          SIZE=$(stat -c '%s' "$ISO_PATH")
          SHA=$(sha256sum "$ISO_PATH" | awk '{print $1}')
          echo "path=$ISO_PATH"   >> "$GITHUB_OUTPUT"
          echo "size=$SIZE"       >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA"      >> "$GITHUB_OUTPUT"
          {
            echo "### ISO Built"
            echo "- Size: $(numfmt --to=iec "$SIZE")"
            echo "- SHA256: \`$SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webbrowse-linux-iso
          path: output/webbrowse-linux.iso
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/webbrowse-linux.iso
          generate_release_notes: true
          body: |
            WebBrowse Linux ${{ github.ref_name }}

            SHA256: `${{ steps.iso.outputs.sha256 }}`
