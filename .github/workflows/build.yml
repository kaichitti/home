name: Build ISO

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build WebBrowse Linux ISO
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ISO (Alpine in Docker)
        id: build
        continue-on-error: true
        run: |
          set -x
          mkdir -p output
          docker run --rm --privileged \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            -e ALPINE_VERSION=3.20 \
            -e ARCH=x86_64 \
            -e PRODUCT_NAME="WebBrowse Linux" \
            -e ISO_NAME=webbrowse-linux.iso \
            -e PROJECT_DIR=/work \
            alpine:3.20 \
            sh -c 'apk add --no-cache bash >/dev/null 2>&1 && sh /work/scripts/build-iso.sh' \
            2>&1 | tee build.log
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Publish build log to step summary
        if: always()
        run: |
          if [ -f build.log ]; then
            {
              echo '### Build log (last 400 lines)'
              echo ''
              echo '```'
              tail -n 400 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo '_build.log missing._' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Post build log to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        with:
          script: |
            const fs = require('fs');
            const outcome = process.env.BUILD_OUTCOME;
            const runUrl = process.env.RUN_URL;
            let tail = '(build.log missing)';
            try {
              const log = fs.readFileSync('build.log', 'utf8');
              tail = log.slice(-45000);
            } catch (e) {
              tail = `(could not read build.log: ${e.message})`;
            }
            const status = outcome === 'success' ? '✅ succeeded' : '❌ failed';
            const body = [
              `CI build ${status} — [run logs](${runUrl})`,
              '',
              '<details><summary>build.log (tail)</summary>',
              '',
              '```',
              tail,
              '```',
              '',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail if build script failed
        if: steps.build.outcome != 'success'
        run: |
          echo "::error::Build script failed. See PR comment / Summary for the log."
          exit 1

      - name: Record ISO metadata
        id: iso
        run: |
          ISO_PATH="output/webbrowse-linux.iso"
          if [ ! -f "$ISO_PATH" ]; then
            echo "::error::ISO not found at $ISO_PATH"
            ls -la output || true
            exit 1
          fi
          SIZE=$(stat -c '%s' "$ISO_PATH")
          SHA=$(sha256sum "$ISO_PATH" | awk '{print $1}')
          echo "path=$ISO_PATH"   >> "$GITHUB_OUTPUT"
          echo "size=$SIZE"       >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA"      >> "$GITHUB_OUTPUT"
          {
            echo "### ISO Built"
            echo "- Size: $(numfmt --to=iec "$SIZE")"
            echo "- SHA256: \`$SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webbrowse-linux-iso
          path: output/webbrowse-linux.iso
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/webbrowse-linux.iso
          generate_release_notes: true
          body: |
            WebBrowse Linux ${{ github.ref_name }}

            SHA256: `${{ steps.iso.outputs.sha256 }}`
