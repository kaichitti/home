name: Build theme zip

# ============================================================================
# 管理画面にそのままアップロードできる fellow.zip を用意する。
#
# zip の中身は必ず fellow/ で始まる構造にする。WordPress のテーマ
# アップローダーは zip 直下のフォルダ名をそのままテーマのフォルダ名として
# 使うため、ここを間違えると2通りの形で失敗する:
#
#   - zip 直下に style.css が無い(二重フォルダ)
#       → 「テーマにスタイルシート style.css がありません」でインストール失敗
#   - zip 直下のフォルダ名が fellow 以外
#       → 別テーマとして増えるだけで、有効化中の fellow は更新されない
#         (見た目が何も変わらないので原因が分かりにくい)
#
# GitHub の「Code > Download ZIP」は前者になるため、テーマの更新には使えない。
# 必ずこのワークフローが作った zip を使うこと。
#
# 取得先:
#   - 通常の push  … Actions の実行ページ > Artifacts
#   - リリース公開 … そのリリースの添付ファイル
#
# ローカルで同じものを作る場合:
#   cd <リポジトリ直下> && zip -rq fellow.zip fellow -x 'fellow/ARCHITECTURE.md'
# ============================================================================

on:
  push:
    paths:
      - 'fellow/**'
      - '.github/workflows/build-theme-zip.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: テーマのバージョンを読む
        id: version
        run: |
          version=$(grep -m1 '^Version:' fellow/style.css | sed 's/Version:[[:space:]]*//' | tr -d '\r')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "テーマバージョン: $version"

      - name: PHP構文チェック
        run: |
          fail=0
          while IFS= read -r file; do
            php -l "$file" > /dev/null || { echo "構文エラー: $file"; fail=1; }
          done < <(find fellow -name '*.php')
          exit $fail

      - name: CSS/JSを圧縮する
        run: |
          # ソースは読みやすさのため圧縮しない方針なので、配布物を作るこの場で
          # .min を生成する。テーマ側は .min があればそちらを読み、無ければ
          # 元のファイルに落ちるので、手でzipを作った場合も壊れない。
          npm install --no-save --no-audit --no-fund csso-cli@4.0.2 terser@5.36.0
          npx csso fellow/assets/css/main.css   -o fellow/assets/css/main.min.css
          npx csso fellow/assets/css/editor.css -o fellow/assets/css/editor.min.css
          npx terser fellow/assets/js/main.js -c -m -o fellow/assets/js/main.min.js

      - name: 圧縮結果を検証する
        run: |
          # 圧縮で中身が壊れていないか、代表的なセレクタの残存と行数で確かめる。
          fail=0
          for pair in "fellow/assets/css/main.css:fellow/assets/css/main.min.css" \
                      "fellow/assets/css/editor.css:fellow/assets/css/editor.min.css" \
                      "fellow/assets/js/main.js:fellow/assets/js/main.min.js"; do
            src=${pair%%:*}; min=${pair##*:}
            if [ ! -s "$min" ]; then echo "✗ $min が生成されていない"; fail=1; continue; fi
            s=$(wc -c < "$src"); m=$(wc -c < "$min")
            echo "$src: $s bytes -> $m bytes"
            # 半分以下に減っていたら削られ過ぎを疑う。増えていたのも異常。
            if [ "$m" -ge "$s" ] || [ "$m" -lt $((s / 4)) ]; then
              echo "✗ $min のサイズが不自然"; fail=1
            fi
          done
          for sel in post-item__link wp-block-post-template post-list--card fellow-steps__title; do
            grep -q "$sel" fellow/assets/css/main.min.css || { echo "✗ $sel が main.min.css に無い"; fail=1; }
          done
          grep -q "fellow-balloon" fellow/assets/css/editor.min.css || { echo "✗ editor.min.css の内容が欠けている"; fail=1; }
          exit $fail

      - name: zipを作る
        run: |
          mkdir -p build
          # 配布物に含めない開発用ファイル。
          # ARCHITECTURE.md は設計メモ(販売条件などの内部情報を含む)なので除外する。
          # 購入者へ同梱したい場合はこの行を消す。
          zip -rq build/fellow.zip fellow \
            -x 'fellow/ARCHITECTURE.md' \
            -x '*/.DS_Store'
          echo "--- zipの中身(先頭) ---"
          unzip -l build/fellow.zip | head -20

      - name: zipの構造を検証
        run: |
          listing=$(unzip -l build/fellow.zip)

          # WordPress は zip 直下のフォルダをテーマフォルダとして扱う。
          # style.css がその直下に無いとアップロードが弾かれる。
          for required in 'fellow/style.css' 'fellow/index.php' 'fellow/functions.php' 'fellow/screenshot.png'; do
            if ! printf '%s\n' "$listing" | grep -qF " $required"; then
              echo "✗ $required が zip に無い"
              exit 1
            fi
          done

          # 開発用ファイルが配布物に混入していないこと。
          # テーマ配下のファイルはWebから直接読めるため、内部資料は入れない。
          for excluded in 'ARCHITECTURE.md' '.github' '.gitignore'; do
            if printf '%s\n' "$listing" | grep -qF "$excluded"; then
              echo "✗ 開発用ファイル $excluded が zip に混入している"
              exit 1
            fi
          done

          echo '✓ zipの構造は正しい'

      - name: アーティファクトとして添付
        uses: actions/upload-artifact@v4
        with:
          name: fellow-${{ steps.version.outputs.version }}
          path: build/fellow.zip
          if-no-files-found: error

      - name: リリースに添付
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/fellow.zip
