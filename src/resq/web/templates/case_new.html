{% extends "base.html" %}
{% block title %}新規受付{% endblock %}
{% block body %}
<h1>新規受付</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/cases/new">
  <div class="card">
    <h2>お客様</h2>
    <div class="grid">
      <div><label>お名前 *</label><input name="customer" required value="{{ form.customer or '' }}"></div>
      <div><label>連絡先</label><input name="contact" value="{{ form.contact or '' }}"></div>
      <div><label>見積上限額（円）</label><input name="price_cap" inputmode="numeric" value="{{ form.price_cap or '' }}"></div>
      <div><label>保管期限</label><input name="retention_until" type="date" value="{{ form.retention_until or '' }}"></div>
    </div>
  </div>
  <div class="card">
    <h2>本人確認・所有確認・同意書</h2>
    <div class="grid">
      <div><label>同意書の版 *</label><input name="form_version" required value="{{ form.form_version or '2026.11' }}"></div>
      <div><label>本人確認方法 *</label><select name="id_method">
        {% for m in id_methods %}<option {% if form.id_method == m %}selected{% endif %}>{{ m }}</option>{% endfor %}</select></div>
      <div><label>所有確認 *</label><select name="ownership">
        {% for o in ownerships %}<option {% if form.ownership == o %}selected{% endif %}>{{ o }}</option>{% endfor %}</select></div>
      <div><label>権限者の同意書面（本人所有でない場合は必須）</label><input name="authorization_doc" value="{{ form.authorization_doc or '' }}"></div>
    </div>
  </div>
  <div class="card">
    <h2>お預かり媒体（任意・後からも追加可）</h2>
    <div class="grid">
      <div><label>種別</label><input name="kind" placeholder="HDD / SSD / USB / SD / iPhone / Android" value="{{ form.kind or '' }}"></div>
      <div><label>メーカー</label><input name="maker" value="{{ form.maker or '' }}"></div>
      <div><label>型番</label><input name="model" value="{{ form.model or '' }}"></div>
      <div><label>シリアル</label><input name="serial" value="{{ form.serial or '' }}"></div>
      <div><label>症状</label><input name="symptom" placeholder="誤削除 / 起動しない / 異音 など" value="{{ form.symptom or '' }}"></div>
      <div><label>ご依頼内容</label><input name="request_text" value="{{ form.request_text or '' }}"></div>
    </div>
    <p class="muted">異音・通電の繰り返しがある媒体は電源を入れずに取次へ。ロック解除・回避のご依頼はお受けできません。</p>
  </div>
  <button type="submit">受付を登録</button>
</form>
{% endblock %}
