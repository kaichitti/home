<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}resq{% endblock %} — resq 管理画面</title>
<style>
  :root { --bg:#f6f6f4; --fg:#1d1d1b; --muted:#6b6b66; --line:#d9d8d2; --card:#fff; --acc:#1f5f99;
          --ok:#2e7d32; --warn:#b26a00; --ng:#b3261e; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font-family: "Noto Sans CJK JP","Hiragino Sans","Yu Gothic UI",sans-serif; font-size:14px; }
  header { background:#22303c; color:#fff; padding:10px 20px; display:flex; gap:18px; align-items:center; }
  header a { color:#fff; text-decoration:none; } header .brand { font-weight:700; letter-spacing:.05em; }
  main { max-width:1100px; margin:0 auto; padding:20px; }
  h1 { font-size:20px; margin:4px 0 14px; } h2 { font-size:15px; margin:22px 0 8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:6px; padding:14px 16px; margin-bottom:14px; }
  table { border-collapse:collapse; width:100%; background:var(--card); }
  th, td { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:12px; }
  td.num { text-align:right; font-variant-numeric: tabular-nums; }
  .badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; background:#e7eef6; color:var(--acc); }
  .v-自社 { background:#e6f2e7; color:var(--ok); } .v-条件付き { background:#fff3dc; color:var(--warn); }
  .v-取次 { background:#f3e5f5; color:#6a1b9a; } .v-不可 { background:#fde7e6; color:var(--ng); }
  form.inline { display:inline; }
  button, .btn { background:var(--acc); color:#fff; border:0; border-radius:4px; padding:6px 12px; cursor:pointer;
                 font-size:13px; text-decoration:none; display:inline-block; }
  button.sub { background:#e7e6e0; color:var(--fg); }
  label { display:block; margin:8px 0 3px; color:var(--muted); font-size:12px; }
  input, select { width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:4px; font-size:14px; }
  .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap:4px 16px; }
  .error { background:#fde7e6; color:var(--ng); border:1px solid #f3b9b5; padding:8px 12px; border-radius:4px; }
  .muted { color:var(--muted); } .mono { font-family:monospace; font-size:12px; word-break:break-all; }
</style>
</head>
<body>
<header><span class="brand">resq</span><a href="/">案件一覧</a><a href="/cases/new">新規受付</a>
  <span class="muted" style="margin-left:auto;color:#b8c4cf">この画面は作業機（127.0.0.1）でのみ表示されます</span></header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
