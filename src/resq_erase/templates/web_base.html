<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}消去ステーション{% endblock %} — resq-erase</title>
<style>
  :root { --bg:#f5f4f1; --fg:#1d1d1b; --muted:#6b6b66; --line:#d9d8d2; --acc:#8a2f1f; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:"Noto Sans CJK JP","Hiragino Sans",sans-serif; font-size:14px; }
  header { background:#3b1f1a; color:#fff; padding:10px 20px; display:flex; gap:18px; }
  header a { color:#fff; text-decoration:none; }
  main { max-width:980px; margin:0 auto; padding:20px; }
  table { border-collapse:collapse; width:100%; background:#fff; } th, td { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; }
  th { color:var(--muted); font-size:12px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:6px; padding:14px 16px; margin:12px 0; }
  .badge { padding:1px 8px; border-radius:10px; background:#f3e7e4; color:var(--acc); font-size:12px; }
  .error { background:#fde7e6; color:#b3261e; padding:8px 12px; border-radius:4px; }
  label { display:block; margin:8px 0 3px; color:var(--muted); font-size:12px; }
  input, select { width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:4px; font-size:14px; }
  input[type=checkbox] { width:auto; }
  button { background:var(--acc); color:#fff; border:0; border-radius:4px; padding:7px 14px; cursor:pointer; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:4px 16px; }
  .mono { font-family:monospace; font-size:12px; word-break:break-all; }
</style></head>
<body>
<header><strong>resq-erase</strong><a href="/">媒体一覧</a><a href="/media/new">受付</a></header>
<main>{% block body %}{% endblock %}</main>
</body></html>
