{% extends "web_base.html" %}
{% block body %}
<h1>媒体一覧</h1>
<table>
  <tr><th>#</th><th>受付</th><th>種別</th><th>型番</th><th>シリアル</th><th>依頼者</th><th>状態</th><th>保管場所</th></tr>
  {% for m in media %}
  <tr><td><a href="/media/{{ m.id }}">{{ m.id }}</a></td><td>{{ m.received_at[:10] }}</td><td>{{ m.kind }}</td>
      <td>{{ m.model or "—" }}</td><td class="mono">{{ m.serial }}</td><td>{{ m.requester }}（{{ m.origin }}）</td>
      <td><span class="badge">{{ m.status }}</span></td><td>{{ m.location or "—" }}</td></tr>
  {% else %}<tr><td colspan="8">まだありません</td></tr>{% endfor %}
</table>
{% endblock %}
