{% extends "web_base.html" %}
{% block body %}
<h1>媒体の受付</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/media/new" class="card">
  <div class="grid">
    <div><label>媒体シリアル *（ラベルから）</label><input name="serial" required></div>
    <div><label>種別 *</label><select name="kind">{% for k in kinds %}<option>{{ k }}</option>{% endfor %}</select></div>
    <div><label>依頼者 *</label><input name="requester" required></div>
    <div><label>依頼元 *</label><select name="origin">{% for o in origins %}<option>{{ o }}</option>{% endfor %}</select></div>
    <div><label>消去承諾書（番号等。自社買取品以外は必須）</label><input name="consent_doc"></div>
    <div><label>媒体メーカー</label><input name="maker"></div><div><label>媒体型番</label><input name="model"></div>
    <div><label>機器メーカー</label><input name="device_maker"></div><div><label>機器型番</label><input name="device_model"></div>
    <div><label>機器シリアル</label><input name="device_serial"></div><div><label>保管場所（施錠棚）</label><input name="location"></div>
  </div>
  <p><button>登録</button></p>
</form>
{% endblock %}
