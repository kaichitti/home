<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>消去証明書の照合</title>
<style>
  body { font-family: "Noto Sans CJK JP","Hiragino Sans",sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; color: #222; }
  table { border-collapse: collapse; width: 100%; } th, td { border-bottom: 1px solid #ddd; padding: 6px; text-align: left; }
  td.mono { font-family: monospace; font-size: 12px; word-break: break-all; }
  input { width: 100%; padding: 8px; font-size: 15px; } .result { margin: 10px 0; font-weight: bold; }
</style></head>
<body>
<h1>消去証明書の照合</h1>
<p>お手元の証明書の番号を入力すると、当店が発行した証明書の SHA-256 を表示します。
証明書 PDF のハッシュ（例: <code>sha256sum 証明書.pdf</code>）と一致すれば、発行後に改ざんされていません。</p>
<input id="no" placeholder="E-20261114-0001" autocomplete="off">
<div class="result" id="result"></div>
<table id="list"><tr><th>証明書番号</th><th>発行日</th><th>SHA-256</th></tr>
{% for r in rows %}<tr data-no="{{ r.number }}"><td>{{ r.number }}</td><td>{{ r.issued }}</td><td class="mono">{{ r.sha256 }}</td></tr>{% endfor %}
</table>
<script>
  const rows = [...document.querySelectorAll('#list tr[data-no]')];
  document.getElementById('no').addEventListener('input', e => {
    const q = e.target.value.trim();
    const hit = rows.find(r => r.dataset.no === q);
    rows.forEach(r => r.style.display = (!q || r.dataset.no.startsWith(q)) ? '' : 'none');
    document.getElementById('result').textContent = q ? (hit ? '発行済みの証明書です' : '該当する証明書がありません') : '';
  });
</script>
</body></html>
