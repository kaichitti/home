[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resq"
version = "0.2.0"
description = "来店型修理店向けデータ復旧作業ツール（復旧ビルド）"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "jinja2>=3.1",
  "pillow>=10",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
pdf = ["weasyprint>=60"]
thumbs = ["olefile>=0.46"]          # Thumbs.db（Windows XP 以前）の解析
erase = ["qrcode>=7"]               # 消去証明書の照合用 QR（消去ステーションビルドで使用）
dev = ["pytest>=8", "httpx>=0.27", "qrcode>=7", "olefile>=0.46"]

[project.scripts]
resq = "resq.cli:app"
resq-web = "resq.web:launch_main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["resq*"]
exclude = ["resq_erase*"]  # 消去機能は復旧ビルドに含めない（企画書 §8.2）

[tool.setuptools.package-data]
resq = ["reports/templates/*.html", "reports/templates/*.css", "web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = ["slow: PhotoRec 等の外部ツールを実行する時間のかかるテスト"]
