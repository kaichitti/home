<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ヒマな人のための完全無料チャットサイト。好きな部屋に入るだけ、登録不要。部屋の作成も自由です。">
  <title>ヒマチャット風 - ヒマ人のためのチャットサイト</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>">
</head>
<body>

  <!-- トップ画面（部屋一覧） -->
  <section id="lobby-screen" class="screen active">
    <header class="lobby-header">
      <h1>💬 ヒマチャット風</h1>
      <p class="tagline">ヒマな人のためのチャットサイト。登録不要・完全無料。</p>
      <p class="online-info">🟢 現在 <span id="online-count">0</span> 人がオンライン</p>
    </header>

    <div class="lobby-body">
      <div class="name-box">
        <label for="nickname-input">ニックネーム</label>
        <input
          id="nickname-input"
          type="text"
          placeholder="名前を入力して部屋を選ぼう"
          maxlength="20"
          autocomplete="off"
        >
      </div>

      <div class="room-list-head">
        <h2>チャットルーム一覧</h2>
        <button id="show-create-room" class="btn btn-primary btn-small-pad">＋ 部屋を作る</button>
      </div>

      <form id="create-room-form" class="create-room-form hidden">
        <input id="room-name-input" type="text" placeholder="部屋の名前（例: 音楽好きの部屋）" maxlength="30" required>
        <input id="room-desc-input" type="text" placeholder="部屋の説明（任意）" maxlength="60">
        <div class="create-room-actions">
          <button type="submit" class="btn btn-primary">作成して入室</button>
          <button type="button" id="cancel-create-room" class="btn btn-ghost">やめる</button>
        </div>
      </form>

      <ul id="room-list" class="room-list"></ul>

      <p class="notice">※ 個人情報（本名・住所・連絡先など）は絶対に書き込まないでください。</p>
    </div>
  </section>

  <!-- チャット画面 -->
  <section id="chat-screen" class="screen">
    <header class="chat-header">
      <button id="leave-room" class="btn btn-small">← 一覧へ</button>
      <div class="room-info">
        <div id="room-title" class="room-title">部屋</div>
        <div id="room-desc" class="room-desc"></div>
      </div>
      <button id="toggle-members" class="btn btn-small">👥 <span id="member-count">0</span>人</button>
    </header>

    <div class="chat-body">
      <main id="messages" class="messages" aria-live="polite"></main>
      <aside id="member-panel" class="member-panel hidden">
        <h3>入室中のメンバー</h3>
        <ul id="member-list"></ul>
      </aside>
    </div>

    <footer class="chat-footer">
      <form id="message-form">
        <input
          id="message-input"
          type="text"
          placeholder="メッセージを入力…（「2d6」でサイコロ）"
          maxlength="500"
          autocomplete="off"
        >
        <button type="submit" class="btn btn-primary btn-send">送信</button>
      </form>
    </footer>
  </section>

  <div id="toast" class="toast hidden"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
